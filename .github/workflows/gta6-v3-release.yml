name: Publish GTA VI Music Edits V3
on:
  push:
    branches:
      - gta6-music-edits-v3-20261113
    paths:
      - "gta6-v3/chunks/**"
      - ".github/workflows/gta6-v3-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out uploaded fragments
        uses: actions/checkout@v4
      - name: Reassemble and verify the video archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat gta6-v3/chunks/part-*.bin > dist/GTA6_MUSIC_EDITS_V3_720p.zip
          echo "2c754a92596a132fe6c67ed3c7da7407602cea42224f9b8597e73c15b8d2b605  dist/GTA6_MUSIC_EDITS_V3_720p.zip" | sha256sum -c -
          unzip -tq dist/GTA6_MUSIC_EDITS_V3_720p.zip
          unzip -oq dist/GTA6_MUSIC_EDITS_V3_720p.zip -d dist
          test "$(find dist -maxdepth 1 -name '*.mp4' | wc -l)" -eq 3
      - name: Create a downloadable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="gta6-music-edits-v3-720p-20261113"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.mp4 dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.mp4 dist/*.zip --target "$GITHUB_SHA" --title "GTA VI Music Edits V3 — 3 x 30s" --notes "Three 30-second GTA VI fan video montages with music. Includes action, night drive, and sunset/open world. 720p H.264/AAC version for GitHub sharing; original 1080p exports are kept separately."
          fi
